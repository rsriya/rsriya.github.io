name: Create Newsletter Draft

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update Proton Therapy News
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: newsletter-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create or update newsletter draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          python scripts/create_newsletter.py

      - name: Commit newsletter history
        run: |
          git config user.name "DMV Proton News Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/newsletter_history.json

          if git diff --cached --quiet; then
            echo "No newsletter history changes."
            exit 0
          fi

          git commit -m "Update newsletter draft history"
          git push
