name: Update Proton Therapy Events

on:
  schedule:
    # Every Monday at 8:23 AM Eastern Time.
    - cron: "23 8 * * 1"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update-events:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Update conference events
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_events.py

      - name: Commit updated events
        run: |
          if [ ! -f data/events.json ]; then
            echo "No events.json file exists."
            exit 1
          fi

          git config user.name "DMV Proton Events Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json

          if git diff --cached --quiet; then
            echo "No conference information changed."
            exit 0
          fi

          git commit -m "Update proton therapy conference calendar"

          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
