name: Create Welcome Draft

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update Proton Therapy News
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: welcome-draft
  cancel-in-progress: false

jobs:
  welcome:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Create or update welcome draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/create_welcome.py

      - name: Commit welcome draft tracking
        run: |
          git config user.name "DMV Proton News Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/welcome_draft.json
          if git diff --cached --quiet; then
            echo "No welcome draft tracking changes."
            exit 0
          fi
          git commit -m "Track Buttondown welcome draft"
          git pull --rebase origin master
          git push origin master
