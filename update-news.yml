name: Update Proton Therapy News

on:
  schedule:
    # Four runs per day, deliberately away from the top of the hour.
    - cron: "17 7,13,19,1 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Update news feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_NEWS_MODEL: ${{ vars.OPENAI_NEWS_MODEL }}
        run: |
          python scripts/update_news.py

      - name: Commit updated news
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes to commit."
            exit 0
          fi

          git config user.name "DMV Proton News Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json
          git commit -m "Update proton therapy news"
          git push
